<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- unfurl -->
    <!-- Tab title stays empty until PAGE_TITLE is filled. Card title and image are the same user's. -->
    <title></title>
    <meta name="description" content="__BIO__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__PAGE_TITLE__" />
    <meta property="og:description" content="__BIO__" />
    <meta property="og:image" content="__OG_IMAGE_URL__" />
    <meta property="og:image:alt" content="__PAGE_TITLE__" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__PAGE_TITLE__" />
    <meta name="twitter:description" content="__BIO__" />
    <meta name="twitter:image" content="__OG_IMAGE_URL__" />
    <meta name="twitter:image:alt" content="__PAGE_TITLE__" />
    <!-- /unfurl -->
    <script>
      document.documentElement.dataset.appearance = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "day";
    </script>
    <link rel="stylesheet" href="billboard.css" />
    <link rel="preload" href="assets/inter-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/inter-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/inter-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/silk-day.jpg" as="image" />
    <link rel="preload" href="assets/silk-dark.jpg" as="image" />
    <link rel="preload" href="assets/silk-ribbon.jpg" as="image" />
    <link rel="preload" href="assets/silk-peach.jpg" as="image" />
  </head>
  <body>
    <div id="billboard" class="page"></div>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script src="billboard.js"></script>
  </body>
</html>
